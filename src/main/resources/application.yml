server:
  port: 8080
  tomcat:
    max-connections: 10000   # conexões abertas simultâneas aceitas
    accept-count: 1000       # fila quando todas estão ocupadas

spring:
  threads:
    virtual:
      enabled: true          # uma thread virtual por requisição: esperar I/O é barato

gateway:
  connect-timeout-seconds: 10
  read-timeout-seconds: 60
  retry-max: 2          # só GET
  retry-backoff-ms: 500
  max-items: 500
  max-response-bytes: 5000000

  # Desempenho / muitas cidades ao mesmo tempo
  cache-ttl-seconds: 30        # GET repetido dentro deste prazo nem vai à API externa (0 = desliga)
  cache-max-ttl-seconds: 300   # teto para o parâmetro cache= pedido pelo Oracle
  cache-max-entries: 5000
  max-concurrent-per-host: 100 # chamadas simultâneas por API externa; acima disso espera
  queue-timeout-seconds: 10    # espera máxima na fila antes de responder 503

  # Allowlist: só estes hosts podem ser chamados (minúsculas, sem https:// e sem porta).
  allowed-hosts:
    - pncp.gov.br
    - viacep.com.br

  # Opções de SSL por host (OPCIONAL, só para hosts que precisam). Host listado aqui também é permitido.
  # Chave com ponto exige colchetes e aspas.
  # hosts:
  #   "[api.homolog.interna]":
  #     insecure: true            # aceita qualquer certificado: SÓ homologação
  #   "[api.com.mtls]":
  #     trust-store: /etc/gateway/trust.p12
  #     trust-store-password: ${TRUST_PASS}
  #     key-store: /etc/gateway/client.p12
  #     key-store-password: ${KEY_PASS}

  # APIs lógicas: o Oracle cita só o nome (api=pncp) e o gateway injeta os headers.
  # apis:
  #   pncp:
  #     host: pncp.gov.br         # prende o token a este host (recomendado)
  #     headers:
  #       Authorization: "Bearer ${PNCP_TOKEN}"
